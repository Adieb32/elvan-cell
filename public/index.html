<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Elvan Cell</title>
  <link rel="stylesheet" href="css/style.css?v=2.4" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo">📱</div>
      <h1>ELVAN CELL</h1>
      <p class="sub">Masuk untuk mencatat transaksi dan kas harian</p>
      <form id="loginForm" autocomplete="on">
        <div class="login-error" id="loginError"></div>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" autocomplete="username" required autofocus />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pass-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" class="pass-toggle" id="togglePass">Lihat</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="loginBtn" type="submit">Masuk</button>
      </form>
    </div>
  </div>
  <script src="vendor/supabase.js"></script>
  <script src="js/config.js?v=2.4"></script>
  <script src="js/supa.js?v=2.4"></script>
  <script src="js/login.js?v=2.4"></script>
</body>
</html>
